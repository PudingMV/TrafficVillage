# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "check-json" },
    { id = "check-yaml" },
    { id = "check-xml" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "dotnet-format", name = "dotnet format", language = "system", entry = "dotnet format --verify-no-changes", types_or = ["c#", "csproj", "sln", "editorconfig"], pass_filenames = false, priority = 10 },
    { id = "dotnet-test", name = "dotnet test", language = "system", entry = "dotnet test", types_or = ["c#", "csproj", "sln"], pass_filenames = false, priority = 20 },
]
